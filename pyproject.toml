[project]
name = "web-shop"
version = "0.1.0"
description = "Kleiner Server mit FastAPI, PostgreSQL, Pydantic und uv"
readme = "README.md"
requires-python = ">=3.15"

dependencies = [
    # https://github.com/agronholm/anyio fuer Starlette
    "anyio>=4.15.1,<5.0.0",
    # https://github.com/python-cffi/cffi
    # Foreign Function Interface for Python calling C code, z.B. in cryptography
    "cffi>=2.1.1,<3.0.0",
    # Fuer Pydantic zur Validierung https://github.com/JoshData/python-email-validator
    "email-validator>=2.3.0,<3.0.0",
    # https://fastapi.tiangolo.com einschl. starlette, pydantic, uvicorn
    "fastapi>=0.141.1,<1.0.0",
    # https://github.com/Delgan/loguru
    "loguru>=0.7.3,<1.0.0",
    # https://openpyxl.readthedocs.io
    "openpyxl>=3.1.5,<4.0.0",
    # Fast, correct Python JSON library supporting dataclasses, datetimes, and numpy
    # https://github.com/ijl/orjson
    "orjson>=3.12.0,<4.0.0",
    # https://github.com/prometheus/client_python
    "prometheus-client>=0.26.0,<1.0.0",
    # https://github.com/trallnag/prometheus-fastapi-instrumentator
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
    # https://www.psycopg.org/psycopg3 https://github.com/psycopg/psycopg3
    "psycopg[binary,pool]>=3.3.6,<4.0.0",
    "psycopg-binary>=3.3.6,<4.0.0",
    "psycopg-pool>=3.3.3,<4.0.0",
    # Validierung https://github.com/pydantic/pydantic https://github.com/pydantic/pydantic/blob/main/pyproject.toml#L49
    "pydantic[email]>=2.13.5,<3.0.0",
    # "Core" fuer Pydantic, implementiert in Rust https://github.com/pydantic/pydantic-core
    "pydantic_core>=2.46.5,<3.0.0",
    # https://github.com/pwaller/pyfiglet
    "pyfiglet>=1.0.4,<2.0.0",
    # https://pyinstrument.readthedocs.io https://github.com/joerick/pyinstrument
    "pyinstrument>=5.1.3,<6.0.0",
    # https://github.com/Kludex/python-multipart fuer fastapi
    "python-multipart>=v0.0.32,<1.0.0",
    # fuer OpenAPI
    "PyYAML>=6.0.3,<7.0.0",
    # https://requests.readthedocs.io
    # fuer python-keycloak (und fuer eigene Integrationstests), auch genutzt von locust
    # einfach, synchron, blockierend
    # nutzt urllib fuer HTTP/1.1; urllib unterstuetzt auch HTTP/2
    # httpx genutzt von FastAPI
    "requests==2.34.2,<3.0.0",
    # https://www.sqlalchemy.org
    # free-threaded Python unterstuetzt ab 2.1
    "SQLAlchemy>=2.1.1,<3.0.0",
    # https://www.starlette.dev bei GitHub gleiche Benutzerkennung wie uvicorn und zttp
    "starlette>=1.7.0,<2.0.0",
    # https://strawberry.rocks https://github.com/strawberry-graphql/strawberry
    "strawberry-graphql>=0.327.7,<1.0.0",
    # https://github.com/astanin/python-tabulate
    "tabulate>=0.10.0,<1.0.0",
    # https://urllib3.readthedocs.io
    # fuer requests, seit 2024 HTTP/2 https://urllib3.readthedocs.io/en/stable/changelog.html#id19
    "urllib3>=2.8.0,<3.0.0",
    # https://www.uvicorn.dev bei GitHub gleiche Benutzerkennung wie Starlette und zttp
    "uvicorn>=0.54.0,<1.0.0",
    # https://github.com/Kludex/zttp  bei GitHub gleiche Benutzerkennung wie uvicorn und zttp
    "zttp>=0.0.34",
]

[build-system]
# https://docs.astral.sh/uv/concepts/build-backend/#using-the-uv-build-backend
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # FastAPI CLI
    "fastapi[standard]>=0.141.1,<1.0.0",
    # https://github.com/MagicStack/httptools genutzt von uvicorn[standard] fuer fastapi[standard]
    "httptools>=0.7.1,<1.0.0",
    # https://locust.io
    "locust>=2.46.6,<3.0.0",
    # genutzt von pytest, fastapi-cli, mkdocs-material
    "pygments>=2.20.0,<3.0.0",
    # https://pytest.org
    "pytest>=9.1.0,<10.0.0",
    # https://pytest-cov.readthedocs.io
    "pytest-cov>=7.1.0,<8.0.0",
    # https://github.com/pytest-dev/pytest-env
    "pytest-env>=1.7.1,<2.0.0",
    # https://github.com/pytest-dev/pytest-html
    "pytest-html>=4.2.0,<5.0.0",
    # https://github.com/pytest-dev/pytest-mock
    "pytest-mock>=3.16.0,<4.0.0",
    # https://saurabh-kumar.com/python-dotenv
    "python-dotenv>=1.2.2,<2.0.0",
]

lint = [
    # http://pyrefly.org https://github.com/facebook/pyrefly
    "pyrefly>=1.4.0-dev.2,<2.0.0",
    # https://docs.astral.sh/ruff https://github.com/astral-sh/ruff
    "ruff>=0.16.9,<1.0.0",
    # https://github.com/astral-sh/ty
    "ty>=0.0.84,<1.0.0",
    "types-openpyxl>=3.1.5.20260827,<4.0.0",
    "types-tabulate>=0.10.0.20260508,<1.0.0",
    # https://github.com/adrienverge/yamllint
    "yamllint>=1.38.0,<2.0.0",
]