[project]
name = "web-shop"
version = "0.1.0"
description = "Kleiner Server mit FastAPI, PostgreSQL, Pydantic und uv"
readme = "README.md"
requires-python = ">=3.15"

dependencies = [
    "fastapi",
    "pydantic",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn[standard]",
]

[build-system]
# https://docs.astral.sh/uv/concepts/build-backend/#using-the-uv-build-backend
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

lint = [
    "ruff",
]

typecheck = [
    "ty",
]

[tool.ruff]
line-length = 88
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.15"
root = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a PostgreSQL connection from DATABASE_URL",
]